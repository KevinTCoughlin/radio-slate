version: 2
# Commit-message prefixes: runtime dependency bumps are `deps:`; GitHub
# Actions bumps are `ci:`; dev tooling (the devcontainer's Dockerfile base
# images) is `chore:`.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      cargo-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # Base images for the Dockerfile used by .devcontainer.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      docker-images:
        patterns: ["*"]
